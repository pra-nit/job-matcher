# Demo configuration for OFFLINE runs (no Ollama, no downloads).
#
# Uses the deterministic hashing embedding provider, so the semantic stage
# runs without downloading sentence-transformers models. Semantic quality is
# degraded compared to BAAI/bge-small-en-v1.5 - for real runs use the default
# config.yaml.

qwen:
  model: qwen3:4b

embedding_model: hashing-demo
embedding_batch_size: 32

experience:
  soft_experience_mode: false
  overqualification_absolute_gap: 2.0
  overqualification_ratio: 1.75

matching:
  match_threshold: 75
  borderline_threshold: 60
  embedding_threshold: 0.02     # hashing similarities are much lower than bge
  embedding_score_floor: 0.0
  embedding_score_ceiling: 0.45
  top_k_embedding: 50
  max_qwen_jobs: 50
  min_career_alignment: 40

max_job_age_days: 14
locations: [India]

paths:
  database: examples/output/demo.db
  output_dir: examples/output
